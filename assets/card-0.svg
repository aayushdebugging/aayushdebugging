<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 196" width="440" height="196" role="img" aria-label="claude-voice">
<style>
  .h{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f8fafc} .d{font:400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1} .s{font:400 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#64748b} .t{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .run{stroke-dasharray:180 1100;animation:run 4s linear infinite;animation-delay:-0.0s}
  @keyframes run{to{stroke-dashoffset:-1280}}
  .glow{animation:g 3s ease-in-out infinite;animation-delay:-0.0s}
  @keyframes g{0%,100%{opacity:.35}50%{opacity:.9}}
</style>
<defs><radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="438" height="194" rx="16" fill="#0b1020"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="url(#r)"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="none" stroke="#22d3ee" stroke-width="2" class="run" pathLength="1280"/>
<circle cx="404" cy="36" r="5" fill="#22d3ee" class="glow"/>
<text x="24" y="46" class="h">🎙  claude-voice</text>
<text x="24" y="84" class="d">Talk to Claude from your terminal and hear it think back.</text>
<text x="24" y="118" class="s">STT → LLM → TTS · barge-in · $0 local stack</text>
<rect x="24" y="150" width="92" height="22" rx="11" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="70" y="165" text-anchor="middle" class="t" fill="#22d3ee">TypeScript</text><rect x="124.0" y="150" width="78" height="22" rx="11" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="163" y="165" text-anchor="middle" class="t" fill="#22d3ee">Realtime</text><rect x="209.6" y="150" width="56" height="22" rx="11" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="238" y="165" text-anchor="middle" class="t" fill="#22d3ee">Voice</text>
</svg>