</style>
<defs><radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".22"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="438" height="194" rx="16" fill="#0b1020"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="url(#r)"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="438" height="194" rx="16" fill="none" stroke="#4ade80" stroke-width="2" class="run" pathLength="1280"/>
<circle cx="404" cy="36" r="5" fill="#4ade80" class="glow"/>
<text x="24" y="46" class="h">🧠  LLM infra lab</text>
<text x="24" y="84" class="d">Cost-aware gateways, RAG pipelines, eval harnesses.</text>
