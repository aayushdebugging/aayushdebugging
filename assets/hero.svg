<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Aayush Kumar — AI Engineer">
<style>
  .name{font:800 76px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-2px}
  .role{font:500 22px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#c7d2fe}
  .tag{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:4px;fill:#64748b}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .grid{animation:run 1.2s linear infinite}
  @keyframes run{from{transform:translateY(0)}to{transform:translateY(16px)}}
  .g1{animation:g1 5s steps(1) infinite}
  .g2{animation:g2 5s steps(1) infinite}
  @keyframes g1{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-6px,2px);opacity:.9}91%{transform:translate(5px,-3px);opacity:.9}93%{transform:translate(-2px,0);opacity:.9}95%{opacity:0}}
  @keyframes g2{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(6px,-2px);opacity:.9}91%{transform:translate(-4px,3px);opacity:.9}93%{transform:translate(3px,1px);opacity:.9}95%{opacity:0}}
  .spin{transform-origin:960px 170px;animation:spin 18s linear infinite}
  .spinr{transform-origin:960px 170px;animation:spin 11s linear infinite reverse}
  .spin3{transform-origin:960px 170px;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{transform-origin:960px 170px;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  .in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .scan{animation:scan 6s linear infinite}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(420px)}}
</style>
